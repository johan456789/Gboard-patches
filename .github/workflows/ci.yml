name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build and test patches
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Probe Morphe registry with GITHUB_TOKEN
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://maven.pkg.github.com/MorpheApp/registry/app/morphe/patches/app.morphe.patches.gradle.plugin/1.3.3/app.morphe.patches.gradle.plugin-1.3.3.pom")
          echo "GITHUB_TOKEN probe status: $code"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build patches
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error

      - name: Run tests
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test :extensions:extension:test

      - name: Generate patches list
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew generatePatchesList

      - name: Upload patches list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patches-list
          path: patches-list.json
          if-no-files-found: error

      - name: Check patches-list.json is committed and up to date
        run: |
          if ! git diff --exit-code -- patches-list.json; then
            echo "::error::patches-list.json is stale; run ./gradlew generatePatchesList and commit it"
            exit 1
          fi
